name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install PowerShell formatter
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Check repository formatting
        run: pnpm format:check

      - name: Build frontend
        run: pnpm build

      - name: Run frontend unit tests
        run: pnpm test:unit

      - name: Install browser for end-to-end tests
        run: pnpm exec playwright install chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Restore bundled runtime cache
        uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: windows-runtime-${{ hashFiles('scripts/prepare-runtime.ps1') }}

      - name: Prepare bundled runtime tools
        run: pnpm runtime:prepare

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust lint checks
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
