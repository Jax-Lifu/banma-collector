[package]
name = "banma-collector"
version = "0.1.0"
description = "斑马百科资源采集与归档工具"
authors = ["Banma Collector"]
edition = "2021"

[lib]
name = "banma_collector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes = "0.8"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "cookies"], default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "sync", "process", "time", "macros"] }
url = "2"
regex = "1"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
base64 = "0.22"
rand = "0.8"
rsa = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
